<style>
:root{--bg:#0A0A0E;--surface:#111116;--card:#18181F;--card-hi:#1E1E27;--border:#232335;--border-hi:#363655;--orange:#FF6200;--orange-lo:rgba(255,98,0,.09);--orange-mid:rgba(255,98,0,.25);--orange-hi:#FF7A20;--blue:#00C8E8;--blue-lo:rgba(0,200,232,.07);--green:#22C55E;--green-lo:rgba(34,197,94,.09);--red:#D42020;--red-lo:rgba(212,32,32,.11);--yellow:#F59E0B;--yellow-lo:rgba(245,158,11,.09);--purple:#A855F7;--purple-lo:rgba(168,85,247,.09);--text:#EEEEF8;--muted:#606090;--dim:#52508C;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--surface)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:inherit;border-radius:8px;padding:10px 14px;width:100%;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-lo)}
input::placeholder,textarea::placeholder{color:var(--muted)}
select option{background:var(--card)}
button{font-family:inherit;cursor:pointer;border:none;outline:none;transition:all .15s;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden;transition:all .15s}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:42%;background:linear-gradient(180deg,rgba(255,255,255,.035) 0%,transparent 100%);border-radius:12px 12px 0 0;pointer-events:none}
.card.clickable{cursor:pointer}.card.clickable:hover{background:var(--card-hi);border-color:var(--border-hi)}
.card.glow{box-shadow:0 0 24px var(--orange-lo)}
.fade{animation:fd .2s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sp{to{transform:rotate(360deg)}}
.spin{display:inline-block;border:2px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:sp .7s linear infinite}
.btn{padding:10px 20px;border-radius:8px;font-weight:600;font-size:14px;border:none;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover:not(:disabled){background:var(--orange-hi)}
.btn-secondary{background:var(--border);color:var(--text)}.btn-secondary:hover:not(:disabled){background:var(--border-hi)}
.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--muted)}.btn-ghost:hover:not(:disabled){color:var(--text)}
.btn-full{width:100%}
.lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:block}
.req{color:var(--red);margin-left:2px;font-weight:700}
.hint{font-size:11px;color:var(--dim);margin-top:4px}
.field{display:flex;flex-direction:column;gap:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.divider{height:1px;background:var(--border);margin:8px 0}
.sh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.sh-title{font-family:'Arial Narrow',Arial,sans-serif;font-size:20px;font-weight:700;color:var(--blue);letter-spacing:1.5px}
.sh-sub{font-size:12px;color:var(--muted);margin-top:2px}
.stat-val{font-family:'Arial Narrow',Arial,sans-serif;font-size:26px;font-weight:700;line-height:1}
.stat-lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
.mpg-bar{height:3px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.mpg-fill{height:100%;border-radius:2px;transition:width .4s}
.tog{display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;user-select:none;-webkit-user-select:none}
.tog-track{width:44px;height:24px;border-radius:12px;position:relative;transition:background .2s;flex-shrink:0}
.tog-thumb{position:absolute;width:18px;height:18px;border-radius:9px;background:#fff;top:3px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.ac-wrap{position:relative}
.ac-drop{position:absolute;top:100%;left:0;right:0;z-index:500;background:var(--card);border:1px solid rgba(255,98,0,.4);border-radius:0 0 8px 8px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
.ac-item{padding:9px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);color:var(--text)}
.ac-item:hover{background:var(--card-hi)}
.ac-foot{padding:5px 14px;font-size:10px;color:var(--dim)}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity .4s}
.logo{font-family:'Arial Narrow',Arial,sans-serif;font-size:42px;font-weight:700;letter-spacing:5px}
.lo{color:var(--orange)}.lb{color:var(--blue)}
#app{max-width:640px;margin:0 auto;min-height:100vh;display:none;flex-direction:column}
#hdr{background:rgba(17,17,22,.94);border-bottom:1px solid var(--border);padding:12px 16px 10px;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
#hi{display:flex;justify-content:space-between;align-items:center}
.hlogo{font-family:'Arial Narrow',Arial,sans-serif;font-size:24px;font-weight:700;letter-spacing:3px;line-height:1}
.hsub{font-size:9px;color:var(--dim);letter-spacing:2.5px;text-transform:uppercase}
#main{flex:1;padding:16px 16px 100px;overflow-y:auto}
#nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:rgba(17,17,22,.92);border-top:1px solid var(--border);display:flex;z-index:100;backdrop-filter:blur(12px)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0;padding-bottom:max(10px,env(safe-area-inset-bottom,10px));background:transparent;border:none;border-top:2px solid transparent;color:var(--muted);cursor:pointer;transition:color .15s}
.nb.on{color:var(--orange);border-top-color:var(--orange)}
.ni{font-size:20px}.nl{font-size:10px;margin-top:2px}.nb.on .nl{font-weight:700}
.tab{flex:1;padding:10px 0;border-radius:8px;font-weight:600;font-size:13px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.tab.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.diyc{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;border:2px solid var(--muted)}
.diyc.on{background:var(--green);border-color:var(--green)}
.adv-tog{font-size:13px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
.adv-arr{display:inline-block;transition:transform .2s}
.adv-arr.o{transform:rotate(90deg)}
.adv-panel{padding:14px;background:var(--purple-lo);border:1px solid rgba(168,85,247,.2);border-radius:10px;display:none;flex-direction:column;gap:12px}
.adv-panel.o{display:flex}
.adv-title{font-size:11px;color:var(--purple);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.oil-rec{padding:8px 12px;background:var(--yellow-lo);border:1px solid rgba(245,158,11,.27);border-radius:8px;font-size:12px;color:var(--yellow)}
.lock-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;cursor:pointer}
.lock-row:hover{border-color:var(--orange)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:2000;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(4px)}
.modal-box{background:var(--card);border:1px solid var(--border-hi);border-radius:14px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 16px 40px rgba(0,0,0,.6)}
.badge-dot{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;border-radius:8px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;color:#fff}
</style>
</head>

// Odometer Linearity Validation
function getNonLinearMap(vehicleId){
  var v=S.vehicles.find(function(x){return x.id===vehicleId;});
  var map={};
  if(!v)return map;
  var clDates=(v.clusterEvents||[]).map(function(e){return e.date;});
  var all=[];
  vFuel(vehicleId).forEach(function(l){if(+l.odometer>0)all.push({id:l.id,date:l.date,odo:+l.odometer,kind:'fuel'});});
  vMaint(vehicleId).forEach(function(l){if(+l.odometer>0)all.push({id:l.id,date:l.date,odo:+l.odometer,kind:'maint',type:l.type});});
  all.sort(function(a,b){var d=new Date(a.date)-new Date(b.date);return d!==0?d:a.odo-b.odo;});
  for(var i=1;i<all.length;i++){

    if(cur.odo<prev.odo&&!hasCluster){
      map[cur.id]={prevOdo:prev.odo,prevDate:prev.date,curOdo:cur.odo};
    }
  }
  return map;
}

function getPrevOdo(vehicleId,dateStr,excludeId){
  var all=[];
  vFuel(vehicleId).forEach(function(l){if(l.id!==excludeId&&+l.odometer>0&&l.date<=dateStr)all.push({date:l.date,odo:+l.odometer});});
  vMaint(vehicleId).forEach(function(l){if(l.id!==excludeId&&+l.odometer>0&&l.date<=dateStr)all.push({date:l.date,odo:+l.odometer});});
  if(!all.length)return 0;

}

// Weighted Stats Calculation
function stats(fuel,maint,m,v){
  if(!v)return{};
  var cut=cutoff(m,v.purchaseDate||v.addedDate);
  var fl=fuel.filter(function(l){return new Date(l.date+'T12:00:00').getTime()>=cut;});
  var ml=maint.filter(function(l){return new Date(l.date+'T12:00:00').getTime()>=cut&&(!l.pending);});
  var val=fl.filter(function(l){return !l.partial&&+l.miles>0&&+l.gallons>0;});

  var valGal=sm(val,function(l){return +l.gallons;});
  var avg=valGal>0?(valMi/valGal):null;
  var best=mpgs.length?Math.max.apply(null,mpgs):null;
  var worst=mpgs.length?Math.min.apply(null,mpgs):null;
  var mi=sm(fl,function(l){return +l.miles;});
  var fc=sm(fl,function(l){return +l.totalCost;});

}
